groups:
  G1_EXCLUSIONS:
    name: "Grupo 1 — Eliminaciones Convenios PDF"
    control_point_out: C2
    rules:
      - id: C01
        name: "Eliminar materiales con tipo de planificación ZZ"
        enabled: {MLCC: true}
        priority: 1
        severity: ERROR
        action: EXCLUDE
        config:
          planning_types: [ZZ]

  G2_RESCUE:
    name: "Grupo 2 — Rescates Convenios"
    control_point_out: C3
    rules: []

  G3_MARKING:
    name: "Grupo 3 — Identificación Convenios PDF"
    control_point_out: C3
    rules:
      - id: C02
        name: "Materiales duplicados dentro del mismo contrato"
        enabled: {MLCC: true}
        priority: 1
        severity: INFO
        action: MARK
      - id: C03
        name: "Materiales presentes en más de un contrato vigente"
        enabled: {MLCC: true}
        priority: 2
        severity: INFO
        action: MARK
        config:
          active_after: "2025-12-31"
      - id: C04
        name: "Ítems sin movimientos en los últimos 24 meses"
        enabled: {MLCC: true}
        priority: 3
        severity: INFO
        action: MARK
      - id: C05
        name: "Diferencia entre descripción del maestro y contrato"
        enabled: {MLCC: true}
        priority: 4
        severity: INFO
        action: MARK
      - id: C07
        name: "Proveedor/material repetido en contratos diferentes"
        enabled: {MLCC: true}
        priority: 5
        severity: INFO
        action: MARK
      - id: C09
        name: "Contratos vencidos con saldo sin consumo"
        enabled: {MLCC: true}
        priority: 6
        severity: INFO
        action: MARK
        config:
          cutoff_date: "2025-12-31"
          pending_qty_column: "pending_planned_qty"
      - id: C06
        name: "Contratos sin definición de Incoterm"
        enabled: {MLCC: false}
        priority: 90
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No existe campo Incoterm en los inputs MLCC actuales."
      - id: C08
        name: "Contratos próximos a vencer"
        enabled: {MLCC: false}
        priority: 91
        severity: INFO
        action: MARK
        config:
          disabled_reason: "El PDF deja el período a definir; 4 meses es solo estimación."
      - id: C10
        name: "Convenios vigentes no utilizados"
        enabled: {MLCC: false}
        priority: 92
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No hay campo directo de utilización del convenio; requiere criterio de negocio."
      - id: C11
        name: "PIR estándar y Supply Option"
        enabled: {MLCC: false}
        priority: 93
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No existe campo Supply Option y la tarea implica acción SAP posterior."

reporting:
  profiling_summary:
    - id: C01
      label: "Tipo planificación material"
      column: "material_planning_type"
    - id: C04
      label: "Movimiento 24 meses"
      column: "material_no_movement_24m"
    - id: C09
      label: "Saldo pendiente"
      column: "pending_planned_qty"

diagram:
  title: "Lundin — Pipeline Convenios MLCC (alcance PDF)"
  preamble:
    - id: start
      label: "DATOS\nRECIBIDOS"
      shape: oval
    - id: ingestion
      label: "INGESTA\nMATERIALES\nNORMALIZACIÓN"
      shape: box
    - id: C1
      label: "CONVENIOS\nNORMALIZADOS"
      shape: label
      control_point: C1
  group_output_labels:
    G1_EXCLUSIONS: "CONVENIOS SIN ZZ"
  final_outputs:
    - id: C3
      label: "CONVENIOS\nIDENTIFICADOS"
      edge_label: "Continúa"
      kind: success
      control_point: C3
    - id: C2_NO_MIGRA
      label: "CONVENIOS\nELIMINADOS"
      edge_label: "Eliminar"
      kind: exclude
      control_point: C2_NO_MIGRA
