groups:
  G1_EXCLUSIONS:
    name: "Grupo 1 — Conclusiones OC PDF"
    control_point_out: C2
    rules:
      - id: P03
        name: "Concluir OC con más de 6 meses de atraso"
        enabled: {MLCC: false}
        priority: 1
        severity: ERROR
        action: EXCLUDE
        config:
          disabled_reason: "Requiere validación previa de Lundin y criterio formal de material crítico/spot/convenio."
      - id: P04
        name: "Concluir OC de materiales reparados con más de 12 meses de atraso"
        enabled: {MLCC: false}
        priority: 2
        severity: ERROR
        action: EXCLUDE
        config:
          disabled_reason: "Requiere validación previa de Lundin y definición confiable de material reparado."

  G2_RESCUE:
    name: "Grupo 2 — Rescates OC"
    control_point_out: C3
    rules: []

  G3_MARKING:
    name: "Grupo 3 — Identificación OC PDF"
    control_point_out: C3
    rules:
      - id: P01
        name: "OC con fecha de entrega vencida y saldo pendiente"
        enabled: {MLCC: true}
        priority: 1
        severity: INFO
        action: MARK
        config:
          reference_date: "2026-05-25"
          open_qty_column: "pending_delivery_qty"
          open_value_column: "pending_delivery_value"
          purchase_requisition_column: "purchase_requisition"
          require_purchase_requisition: true
      - id: P05
        name: "OC de cargo directo vencidas no entregadas"
        enabled: {MLCC: true}
        priority: 2
        severity: INFO
        action: MARK
        config:
          reference_date: "2026-05-25"
          open_qty_column: "pending_delivery_qty"
          open_value_column: "pending_delivery_value"
          account_assignment_types: [K]
      - id: P02
        name: "OC pendientes sin definición de Incoterm"
        enabled: {MLCC: false}
        priority: 90
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No existe campo Incoterm en los inputs MLCC actuales."
      - id: P06
        name: "Clasificar cargo directo vencido en Operación/Capex/reparables/garantías"
        enabled: {MLCC: false}
        priority: 91
        severity: INFO
        action: MARK
        config:
          disabled_reason: "Los inputs no contienen una clasificación confiable para esas categorías."
      - id: OS01
        name: "Órdenes de servicio vencidas con saldo"
        enabled: {MLCC: false}
        priority: 92
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No existe dominio de entrada separado para órdenes de servicio."
      - id: OS02
        name: "HES pendientes"
        enabled: {MLCC: false}
        priority: 93
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No existe campo/dominio HES en los inputs actuales."
      - id: PR01
        name: "PR/SOLPED aprobadas asociadas a necesidades obsoletas"
        enabled: {MLCC: false}
        priority: 94
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No existe dominio de entrada PR/SOLPED; solo referencia de solicitud en algunas OC."
      - id: RES01
        name: "Reservas sin utilización"
        enabled: {MLCC: false}
        priority: 95
        severity: INFO
        action: MARK
        config:
          disabled_reason: "No existe dominio de entrada de reservas."

reporting:
  profiling_summary:
    - id: P01
      label: "Fecha de entrega"
      column: "delivery_date"
    - id: P01_QTY
      label: "Cantidad pendiente entrega"
      column: "pending_delivery_qty"
    - id: P01_PR
      label: "Solicitud de pedido"
      column: "purchase_requisition"
    - id: P05
      label: "Tipo de imputación"
      column: "account_assignment_type"


diagram:
  title: "Lundin — Pipeline Órdenes de Compra MLCC (alcance PDF)"
  preamble:
    - id: start
      label: "DATOS\nRECIBIDOS"
      shape: oval
    - id: ingestion
      label: "INGESTA\nMATERIALES\nNORMALIZACIÓN"
      shape: box
    - id: C1
      label: "ÓRDENES DE COMPRA\nNORMALIZADAS"
      shape: label
      control_point: C1
  group_output_labels:
    G1_EXCLUSIONS: "OC SIN CONCLUSIONES ACTIVAS"
  final_outputs:
    - id: C3
      label: "OC\nIDENTIFICADAS"
      edge_label: "Continúa"
      kind: success
      control_point: C3
    - id: C2_NO_MIGRA
      label: "OC\nCONCLUIDAS"
      edge_label: "Concluir"
      kind: exclude
      control_point: C2_NO_MIGRA
