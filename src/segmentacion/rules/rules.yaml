groups:
  G1_EXCLUSIONS:
    name: "Grupo 1 — Exclusiones comunes de migración"
    control_point_out: C2
    rules:
      - id: E01
        name: "Excluir registros sin contrato vigente (fin de contrato <= 2026-06-30 o sin cruce), sin saldo pendiente o con indicador de borrado"
        enabled: {MLCC: true, CCMC: true}
        priority: 1
        severity: ERROR
        action: EXCLUDE
        config:
          cutoff_date: "2026-06-30"
          # Vigencia tomada del cruce con los reportes CONTRATOS VIGENTES
          # (contrato marco; en su defecto documento de compra). Sin fallback a
          # fechas de la base OC y sin cruce => no vigente.
          primary_date_column: "contract_end_date"
          fallback_date_column: ""
          missing_date_means_expired: true
          pending_qty_column: "pending_delivery_qty"
          pending_value_column: "pending_delivery_value"
          deletion_flag_column: "deletion_flag"

  G2_RESCUE:
    name: "Grupo 2 — Rescates segmentación"
    control_point_out: C2
    rules: []

  G3_MARKING:
    name: "Grupo 3 — Marcas complementaria"
    control_point_out: C2
    rules:
      - id: M01
        name: "Categorizar filas por estado de migración (vigente / vencido con saldo / vencido sin saldo)"
        enabled: {MLCC: true, CCMC: true}
        priority: 1
        severity: INFO
        action: MARK
        config:
          cutoff_date: "2026-06-30"
          primary_date_column: "delivery_date"
          fallback_date_column: "validity_end"
          value_column: "pending_delivery_value"
          excluded_position_types: ["D"]
          output_column: "migration_category"
          year_column: "delivery_year"
          category_vigente: "VIGENTE"
          category_vencido_con_saldo: "NO_VIGENTE_CON_SALDO"
          category_vencido_sin_saldo: "NO_VIGENTE_SIN_SALDO"
          category_excluded_type: "TIPO_D"

complementaria_report:
  enabled: {MLCC: true, CCMC: true}
  output_subdir: "reportes"
  group_by_plant: true
  vencido_con_saldo_by_year: true

reporting:
  profiling_summary:
    - id: E01_DATE
      label: "Fecha efectiva entrega/vencimiento"
      column: "delivery_date"
    - id: E01_QTY
      label: "Cantidad por entregar"
      column: "pending_delivery_qty"
    - id: E01_VALUE
      label: "Valor por entregar"
      column: "pending_delivery_value"

diagram:
  title: "Lundin — Segmentación MLCC desde Órdenes de Compra"
  preamble:
    - id: start
      label: "OC TODOS\nLOS PERIODOS"
      shape: oval
    - id: segmentation
      label: "SEGMENTACIÓN\nCONTRATOS / OS"
      shape: box
    - id: C1
      label: "SEGMENTOS\nC1"
      shape: label
      control_point: C1
  group_output_labels:
    G1_EXCLUSIONS: "SEGMENTOS MIGRABLES"
  final_outputs:
    - id: C2
      label: "C2\nMIGRA"
      edge_label: "Migra"
      kind: success
      control_point: C2
    - id: C2_NO_MIGRA
      label: "C2\nNO MIGRA"
      edge_label: "No migra"
      kind: exclude
      control_point: C2_NO_MIGRA
